<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08070d">
<title>NEXORA — Ton univers. Tes découvertes.</title>
<link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>
<div class="noise"></div>

<main class="home">

  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-symbol">N</span>
      <span class="brand-name">NEXORA</span>
    </a>

    <a class="admin-link" href="/admin/" aria-label="Administration">
      <span class="admin-dot"></span>
      <span>Administration</span>
    </a>
  </header>

  <section class="hero">

    <div class="logo-orbit">
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="logo-core">N</div>
    </div>

    <p class="eyebrow">NEXORA / ACCESS</p>

    <h1>
      Ton univers.<br>
      <span>Tes découvertes.</span>
    </h1>

    <p class="subtitle">
      Entre ton code et retrouve instantanément ton contenu.
    </p>

    <section class="access-card">

      <div class="card-glow"></div>

      <div class="card-header">
        <div>
          <span class="card-kicker">ESPACE PERSONNEL</span>
          <h2>Accéder à mon contenu</h2>
        </div>

        <span class="status">
          <i></i> SÉCURISÉ
        </span>
      </div>

      <div class="input-wrap">
        <span class="input-icon">⌁</span>

        <input
          class="code-input"
          type="text"
          placeholder="ENTRE TON CODE"
          maxlength="32"
          autocomplete="off"
          spellcheck="false"
        >

        <span class="input-counter">0/32</span>
      </div>

      <button class="btn" type="button">
        <span>Accéder au contenu</span>
        <span class="btn-arrow">↗</span>
      </button>

      <div class="result" id="result"></div>

      <p class="privacy">
        Ton code est utilisé uniquement pour retrouver ton contenu.
      </p>

    </section>

    <div class="hero-footer">
      <span></span>
      <p>UNIVERS NUMÉRIQUE · SIMPLE · RAPIDE · PRIVÉ</p>
      <span></span>
    </div>

  </section>

</main>

<script src="/assets/js/app.js"></script>
</body>
</html>
